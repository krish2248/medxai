[project]
name = "medxai"
version = "0.0.1"
description = "Multi-modal medical explainable AI + curated Wellness Atlas. Research/educational use only — not a medical device."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Krish Soni", email = "sonikrish2248@gmail.com" },
]
keywords = ["medical-imaging", "explainable-ai", "xai", "tabular-ml", "reproducibility"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Phase 0 keeps runtime deps to the bare minimum needed for the
# scaffolding tests + theme linter. Optional groups below add the
# heavy stuff (torch, sklearn, captum, ...) phase by phase so a fresh
# clone of Phase 0 installs in seconds and CI stays fast.
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
# The groups below are intentionally empty in Phase 0 and will be
# populated as their phases land. Their existence here is a contract:
# `uv sync --extra vision` etc. must always succeed.
vision = []
tabular = []
xai = []
app = []

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medxai"]

[dependency-groups]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

# ---------------- Ruff (lint + format) ----------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = [
    "data",
    "mlruns",
    "site",
    "frontend/.next",
    "node_modules",
    "reports/paper/build",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PL",   # pylint
    "RUF",  # ruff-specific
    "ARG",  # unused arguments
    "PTH",  # pathlib
    "TID",  # tidy imports
]
ignore = [
    "PLR0913",  # too many args — common in ML APIs
    "PLR2004",  # magic numbers — fine in tests/configs
    "E501",     # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "ARG"]
"scripts/**" = ["PLR0915"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ---------------- Mypy (strict on src/) ----------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
files = ["src/medxai"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
ignore_errors = true

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/medxai",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: requires a CUDA GPU",
    "integration: end-to-end fixture-based tests",
    "property: hypothesis-based property tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources.*",
]

# ---------------- Coverage ----------------
[tool.coverage.run]
branch = true
source = ["src/medxai"]
omit = ["src/medxai/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# Phase 0 has very little code; we ratchet to 80% (per spec Section 14)
# once Phase 2 lands real modules. Setting it to 0 now would silently let
# regressions through, so we set it to 50 as a soft floor for scaffolding.
fail_under = 50
